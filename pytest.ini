# asistido por SI: Claude Code (Anthropic) y Cursor (agente), escritura y revisión de código; configuración común de Datos y Gemelo
[pytest]
pythonpath = src
testpaths = pruebas
filterwarnings =
    # rasterio 1.4.4 emite PendingDeprecationWarning propio (no del proyecto); solo esa advertencia se silencia
    ignore::PendingDeprecationWarning:rasterio
markers =
    datos_reales: usa archivos descargados en datos/crudos
    lento: corre la optimización o ensambles grandes
