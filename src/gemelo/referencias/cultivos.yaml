# asistido por SI: Cursor (agente), escritura y revisión de código; núcleo del gemelo digital en el hackatón
# Catálogo de cultivos del gemelo.
# - Bloque fao56: copia literal de src/simulacion/referencias/fao56.yaml (rama datos, INV-ROT §3). No se edita aquí:
#   al integrar, parametros.py puede leer directamente aquel archivo con el mismo formato.
# - altura_m: FAO-56 Tabla 12 (altura máxima del cultivo), ficha EV-ROT-010.
# - rue (g MS por MJ de radiación solar interceptada), temperaturas cardinales (función beta de Yan y Hunt, 1999),
#   índice de cosecha, N en biomasa, índice de cosecha de N y Ndfa: SUPUESTO de orden de magnitud
#   con rango; cada uno debe reemplazarse con ficha EV o calibración local. El ensamble muestrea el rango completo.
# - Un cultivo con apto_rotacion: false (perennes o de corte múltiple) no se simula: el ciclo anual no lo representa.
comunes:
  rue: {unidad: "g/MJ", etiqueta: SUPUESTO, referencia: "orden de magnitud de RUE en radiación solar (Sinclair y Muchow, 1999); ficha EV pendiente"}
  t_base: {unidad: "°C", etiqueta: SUPUESTO, referencia: "temperatura base de la función beta (Yan y Hunt, 1999); valor de diseño"}
  t_opt: {unidad: "°C", etiqueta: SUPUESTO, referencia: "temperatura óptima de la función beta (Yan y Hunt, 1999); valor de diseño"}
  t_max: {unidad: "°C", etiqueta: SUPUESTO, referencia: "temperatura máxima de la función beta (Yan y Hunt, 1999); valor de diseño"}
  indice_cosecha: {unidad: "kg/kg", etiqueta: SUPUESTO, referencia: "índice de cosecha de orden de magnitud; varía con variedad y manejo"}
  n_biomasa: {unidad: "kg N/kg MS", etiqueta: SUPUESTO, referencia: "concentración media de N en la biomasa aérea a cosecha; orden de magnitud"}
  indice_cosecha_n: {unidad: "kg/kg", etiqueta: SUPUESTO, referencia: "fracción del N de la planta que sale con la cosecha; orden de magnitud"}
  ndfa: {unidad: "kg/kg", etiqueta: SUPUESTO, referencia: "fracción del N de la planta derivada de la fijación biológica; muy variable entre sitios"}
