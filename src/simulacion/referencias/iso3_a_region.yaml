# ENSO acotado por ADM1 (INFERENCIA): solo las unidades con esos ADM1 llevan la región; la unidad nacional (sin ADM1) no.
enso_adm1:
  "Sur de Brasil, Uruguay y Pampa":
    BRA: [Rio Grande do Sul, Santa Catarina, Paraná]
    ARG: [Buenos Aires, Córdoba, Santa Fe, Entre Ríos, La Pampa]
  # INFERENCIA: la fuente (CPC, DJF) habla de "TX a FL"; ADM1 de la franja sur-sureste del Golfo y el Atlántico sur
  "Sur de EE. UU.":
    USA: [Texas, Louisiana, Mississippi, Alabama, Georgia, Florida, South Carolina]
  "Australia oriental y norte":
    AUS: [Queensland, New South Wales, Victoria, Northern Territory, Australian Capital Territory]
# ADM1 sin teleconexión: Colombia Pacífica es PENDIENTE por contradicción de fuentes; solo Chocó es del todo Pacífico
# (Valle, Cauca y Nariño son mixtos y quedan con la señal: limitación).
enso_excluye_adm1:
  COL: [Chocó]
