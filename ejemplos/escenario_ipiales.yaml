# asistido por SI: Cursor (agente), escritura y revisión de código; núcleo del gemelo digital en el hackatón
# Escenario de ejemplo: lote papero en Ipiales, Nariño (Andes de Colombia, lote a 2934 m; celda POWER a 2553 m). Esquema: contratos/gemelo_api.md.
# Ejecutar:  python -m gemelo simular   ejemplos/escenario_ipiales.yaml -o salidas/ipiales_simulacion.json
#            python -m gemelo optimizar ejemplos/escenario_ipiales.yaml -o salidas/ipiales_optimizacion.json
version_contrato: 1

lote:
  id: DEMO-COL-01
  # Nombre, punto, unidad y clima se leen de lotes_demo.json de Datos (no se escriben a mano)
  catalogo: ../datos/referencia/lotes/lotes_demo.json

clima:
  # Forzantes de Datos (T-D5, forzantes_gemelo.md v1, SHA256 en datos/referencia/lotes/SHA256SUMS.txt).
  # La física usa T2M crudo (media y ET0); T2M_MIN_CORR solo para heladas (§4.3).
  fuente: power_csv
  archivo: ../datos/referencia/lotes/power_DEMO-COL-01_diario.csv
  # Lluvia IMERG: sensibilidad solo en modo técnico, nunca escenario equivalente (sobrestima frente a la estación)
  precipitacion_alterna:
    archivo: ../datos/referencia/lotes/imerg_DEMO-COL-01_diario.csv
    comparacion: ../datos/referencia/lotes/comparacion_power_imerg.json
  # Alternativa con la base de la rama datos (mensual desagregado a diario):
  # fuente: sqlite_mensual
  # ruta: ../datos/agroversex.sqlite
  # unidad_id: COL-ADM2-7082276B52108893597118
  # elevacion_m: 2900

suelo:
  fuente: parametros_suelo_json
  archivo: ../datos/referencia/lotes/parametros_suelo_DEMO-COL-01.json
  # Suelo volcánico (MO ~8 %): fuera del dominio de Saxton y Rawls; con un análisis local:
  # fuente: manual
  # arena: 0.45
  # arcilla: 0.18
  # mo_pct: 7.5
  # cos_t_ha: 180
  # cn_suelo: 12

# Alerta de helada en etapa sensible (D-032), provisional en este lote: la mínima corregida sigue más cálida que la
# estación COM00080370 (sesgo leído de la validación de Datos)
alertas:
  helada:
    umbral_c: 0.0
    provisional: true
    validacion: ../datos/referencia/lotes/validacion_temperatura_ipiales.json
    # Estación cercana (criterio del director: <= 5 km y <= 100 m de desnivel): si la serie no genera heladas,
    # la alerta usa su climatología observada (combinación propia)
    estacion: ../datos/referencia/lotes/COM00080370.csv
    estacion_max_km: 5
    estacion_max_desnivel_m: 100

escenario:
  tipo: historico
  anios: 3
  max_miembros: 8

simulacion:
  n_parametros: 8
  semilla: 42
  n_sub: 1
  equilibrio: completo
  referencia: A

calibracion: {}

# Papa con la variante "Europa" de FAO-56 (145 días). Las variedades andinas de altura suelen ser más largas:
# con datos locales, dar etapas: [d_ini, d_des, d_med, d_fin]. Dosis de N SUPUESTO para el ejemplo.
estrategias:
  - id: A
    nombre: Papa continua (habitual)
    etiqueta: "FUENTE EV-ROT-022 (lo común es repetir papa)"
    temporadas:
      - {cultivo: papa, siembra: A1-03-01, etapas_variante: Europa, fertilizacion: [{dia: 0, kg_n: 150}]}
      - {cultivo: papa, siembra: A2-03-01, etapas_variante: Europa, fertilizacion: [{dia: 0, kg_n: 150}]}
      - {cultivo: papa, siembra: A3-03-01, etapas_variante: Europa, fertilizacion: [{dia: 0, kg_n: 150}]}
  - id: B
    nombre: Papa-papa-avena
    etiqueta: "FUENTE EV-ROT-022 (alternativa de Agrosavia)"
    temporadas:
      - {cultivo: papa, siembra: A1-03-01, etapas_variante: Europa, fertilizacion: [{dia: 0, kg_n: 150}]}
      - {cultivo: papa, siembra: A2-03-01, etapas_variante: Europa, fertilizacion: [{dia: 0, kg_n: 150}]}
      - {cultivo: avena, siembra: A3-03-01, fertilizacion: [{dia: 0, kg_n: 40}]}
  - id: C
    nombre: Papa-avena-frijol-papa
    etiqueta: "FUENTE EV-ROT-022 (alternativa papa-avena-arveja; frijol en lugar de arveja, que no está en el catálogo)"
    temporadas:
      - {cultivo: papa, siembra: A1-03-01, etapas_variante: Europa, fertilizacion: [{dia: 0, kg_n: 150}]}
      - {cultivo: avena, siembra: A1-09-01, fertilizacion: [{dia: 0, kg_n: 40}]}
      - {cultivo: frijol, siembra: A2-03-01}
      - {cultivo: papa, siembra: A3-03-01, etapas_variante: Europa, fertilizacion: [{dia: 0, kg_n: 150}]}
  - id: D
    nombre: Papa con avena de cobertura
    etiqueta: ilustrativa
    temporadas:
      - {cultivo: papa, siembra: A1-03-01, etapas_variante: Europa, fertilizacion: [{dia: 0, kg_n: 150}]}
      - {cultivo: avena, siembra: A1-09-01, cosechar: false}
      - {cultivo: papa, siembra: A2-03-01, etapas_variante: Europa, fertilizacion: [{dia: 0, kg_n: 150}]}
      - {cultivo: avena, siembra: A2-09-01, cosechar: false}
      - {cultivo: papa, siembra: A3-03-01, etapas_variante: Europa, fertilizacion: [{dia: 0, kg_n: 150}]}

optimizacion:
  linea_base: A
  campanias:
    - {nombre: semestre A, fecha: "03-01", opciones: [papa, frijol, avena_grano]}
    - {nombre: semestre B, fecha: "09-01", opciones: [avena_cobertura, avena_grano, frijol]}
  opciones:
    papa: {cultivo: papa, etapas_variante: Europa, fertilizacion: [{dia: 0, kg_n: 150}]}
    frijol: {cultivo: frijol}
    avena_grano: {cultivo: avena, fertilizacion: [{dia: 0, kg_n: 40}]}
    avena_cobertura: {cultivo: avena, cosechar: false}
  desfases_dias: [0, 15]
  riego: {permitido: false}
  exigidos: [papa]
  min_cosechas_por_anio: 1
  busqueda: {poblacion: 24, generaciones: 12, miembros_clima: 4, muestras_parametros: 3, miembros_final: 8,
             muestras_final: 6, max_soluciones: 8}

# Paquete estático (python -m gemelo paquete): grilla de deslizadores y calibraciones típicas del lote
paquete:
  n_parametros_grilla: 4
  calibraciones_tipicas:
    mo_laboratorio: {descripcion: "Materia orgánica medida en laboratorio (7,5 %, suelo volcánico)",
                     valores: {suelo.mo_pct: 7.5}}
    n_inicial_bajo: {descripcion: "Análisis de suelo con poco N mineral inicial", valores: {cn.n_mineral_inicial_kg_ha: 15}}
    n_inicial_alto: {descripcion: "Análisis de suelo con mucho N mineral inicial", valores: {cn.n_mineral_inicial_kg_ha: 50}}
    suelo_seco_al_inicio: {descripcion: "Humedad inicial medida baja (30 % del agua disponible)",
                           valores: {agua.fraccion_humedad_inicial: 0.3}}
    suelo_humedo_al_inicio: {descripcion: "Humedad inicial medida alta (80 % del agua disponible)",
                             valores: {agua.fraccion_humedad_inicial: 0.8}}
